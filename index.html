<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maxihihi • Socials</title>

    <link rel="icon" href="maxihihi-logo-001.png">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div id="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <!-- Rain -->
    <div id="rain"></div>

    <!-- Mouse Glow -->
    <div id="mouseGlow"></div>


    <!-- Hover Preview -->
    <div id="hoverPreview">

        <div class="previewIcon">
            <i id="previewIcon"></i>
        </div>

        <div class="previewInfo">
            <strong id="previewTitle"></strong>
            <span id="previewDescription"></span>
            <p id="previewText"></p>
        </div>

    </div>


    <main>

        <section class="card" id="card">

            <!-- Profile -->

            <div class="profile">

                <div class="avatar">

                    <div class="avatarRing"></div>

                    <img
                        id="profileImage"
                        src="maxihihi-logo-001.png"
                        alt="Maxihihi"
                    >

                </div>


                <div class="status" id="status">

                    <span></span>

                    <label id="statusText">
                        Online
                    </label>

                </div>


                <h1 id="name">
                    Maxihihi
                </h1>


                <p
                    class="subtitle"
                    id="subtitle"
                >
                    Developer • Gamer • Creator
                </p>


                <p
                    class="description"
                    id="description"
                >
                    Willkommen 👋
                </p>

            </div>


            <!-- Socials -->

            <div
                class="socials"
                id="socials"
            ></div>


            <!-- Footer -->

            <div class="footer">

                <div class="line"></div>

                <span id="footerText">
                    © 2026 • Made by Maxihihi
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
